<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>A JavaScript calculator</h1>
    </header>

    <div class = "Box">
        <output class = "result"></output>
            
        <div class= "numbers">
            <button>0</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>.</button>
        </div>
        <div class = "operators">
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
            <button class = "equals">=</button>
            <button class = "clear">Clear</button>
            <button class = "backspace ">Backspace</button>
        </div>
    </div>
    
    <div class="keyboard-info">
        <p>Keyboard Support: <b>Enter</b> / <b>=</b> for Equal</p>
        <p><b>Esc</b> for Clear &nbsp; | &nbsp; <b>Backspace</b> for Delete</p>
    </div>
    
    <footer>
        <p>Built with HTML, CSS & JavaScript</p>
        <p>© 2026 Srijan Rastogi. All rights reserved.</p>
    </footer>
</body>
</html>
